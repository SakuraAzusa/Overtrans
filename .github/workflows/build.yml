name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布用的 tag（例如 v1.0.0）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  PY_INSTALLER: pyinstaller==6.22.3

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install $env:PY_INSTALLER

      - name: 打包
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed ^
            --name Overtrans ^
            --contents-directory runtime ^
            --icon "assets\overtrans.ico" ^
            --add-data "app\default_config.json;app" ^
            --add-data "assets;assets" ^
            --collect-all rapidocr ^
            --exclude-module matplotlib --exclude-module pandas --exclude-module scipy ^
            --exclude-module PyQt5 --exclude-module PySide2 --exclude-module torch ^
            main.py
          python tools\prune_dist.py dist\Overtrans
          copy README.md dist\Overtrans\README.md
          copy LICENSE dist\Overtrans\LICENSE
          copy THIRD_PARTY_NOTICES.md dist\Overtrans\THIRD_PARTY_NOTICES.md

      # 中文在 run 块里会被按 ANSI 解码成乱码，这里统一用英文，日志才看得清
      - name: Verify dist
        shell: pwsh
        run: |
          $root = "dist\Overtrans"
          if (-not (Test-Path "$root\Overtrans.exe")) { throw "missing Overtrans.exe" }
          foreach ($m in @("PP-OCRv6_det_small.onnx", "PP-OCRv6_rec_small.onnx", "korean_PP-OCRv5_rec_mobile.onnx")) {
            if (-not (Test-Path "$root\runtime\models\$m")) { throw "missing model: $m" }
          }
          if (-not (Test-Path "$root\LICENSE")) { throw "missing LICENSE" }
          if (-not (Test-Path "$root\README.md")) { throw "missing README.md" }
          if (Test-Path "$root\config.json") { throw "config.json must not be packaged" }
          $mb = [math]::Round(((Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "dist size: $mb MB"
          if ($mb -lt 150 -or $mb -gt 320) { throw "unexpected size: $mb MB (expect 150-320)" }
          Write-Host ("root entries: " + ((Get-ChildItem $root -Name) -join ", "))

      - name: 压缩
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $name = "Overtrans-$tag-win64.zip"
          Compress-Archive -Path "dist\Overtrans\*" -DestinationPath $name -Force
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "已生成 $name"

      - uses: actions/upload-artifact@v4
        with:
          name: Overtrans-win64
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Overtrans ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
